<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>또박키즈 - 한국어 발음 연습</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <div>
        <p class="badge">Kid Korean Pronunciation Trainer</p>
        <h1>또박키즈</h1>
        <p class="subtitle">
          어린 아이도 재미있게! 듣고, 따라 말하고, 별점을 받는 한국어 발음 연습 앱
        </p>
      </div>
      <button id="dailyMissionBtn" class="primary">오늘의 미션 시작</button>
    </header>

    <main class="layout">
      <section class="card">
        <h2>1) 오늘 연습 문장 선택</h2>
        <div id="lessonList" class="lesson-list"></div>
      </section>

      <section class="card practice-card">
        <h2>2) 듣고 따라 말하기</h2>
        <p id="targetSentence" class="target">연습 문장을 고르면 여기에 표시돼요.</p>

        <div class="controls">
          <button id="listenBtn" class="secondary" disabled>문장 듣기 🔊</button>
          <button id="recordBtn" class="primary" disabled>녹음 시작 🎤</button>
        </div>

        <div class="status-grid">
          <p><strong>상태:</strong> <span id="statusText">대기 중</span></p>
          <p><strong>남은 시간:</strong> <span id="timerText">0초</span></p>
          <p><strong>인식된 문장:</strong> <span id="recognizedText">-</span></p>
        </div>

        <div class="meter-wrap">
          <label for="scoreMeter">발음 점수</label>
          <progress id="scoreMeter" max="100" value="0"></progress>
          <p id="scoreText">0점</p>
        </div>

        <div id="feedbackBox" class="feedback">문장을 고른 뒤 연습을 시작해 주세요.</div>
      </section>

      <section class="card">
        <h2>3) 학부모 리포트</h2>
        <ul id="historyList" class="history"></ul>
      </section>
    </main>

    <template id="lessonTemplate">
      <button class="lesson-btn" type="button"></button>
    </template>

    <script src="app.js"></script>
  </body>
</html>
